<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Commerce-Students · CBSE Commerce Revision</title>
  <meta name="description" content="Commerce-Students — chapter-wise revision, original questions, checklists and CBSE-format practice papers for Class 11 and 12: Accountancy, Business Studies, Economics, English and Information Technology.">
  <style>
    :root {
      --bg: #f7fbff;
      --fg: #172554;
      --muted: #5b6b84;
      --line: #d7e3f2;
      --line-strong: #172554;
      --card: #eef6ff;
      --card-2: #e1efff;
      --accent: #2563eb;
      --accent-2: #7c3aed;
      --accent-warm: #f97316;
      --shadow: 0 8px 24px rgba(37, 99, 235, .08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --serif: Georgia, "Times New Roman", serif;
    }
    html[data-theme="dark"] {
      --bg: #0b1220;
      --fg: #e8f0ff;
      --muted: #9fb0c9;
      --line: #263754;
      --line-strong: #e8f0ff;
      --card: #111d31;
      --card-2: #182844;
      --accent: #60a5fa;
      --accent-2: #a78bfa;
      --accent-warm: #fb923c;
      --shadow: 0 8px 28px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15.5px/1.6 var(--font);
      transition: background .2s ease, color .2s ease;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.15; letter-spacing: -.035em; font-weight: 800; }
    p { margin: 0; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    .topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .topbar-inner { min-height: 68px; display: flex; align-items: center; gap: 26px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; flex: none; }
    .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border: 1.5px solid var(--fg); border-radius: 10px; color: var(--fg); overflow: hidden; }
    .brand-mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .brand-text strong { display: block; font-size: 16.5px; letter-spacing: -.03em; }
    .brand-text small { display: block; color: var(--muted); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
    .main-nav { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
    .nav-link { padding: 8px 13px; border-radius: 9px; color: var(--muted); font-size: 14px; font-weight: 650; transition: .15s ease; }
    .nav-link:hover { color: var(--fg); background: var(--card); }
    .nav-link.active { color: var(--bg); background: var(--fg); }
    .header-tools { margin-left: auto; display: flex; align-items: center; gap: 9px; }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); transition: .15s ease; }
    .icon-btn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
    .icon-btn svg { width: 19px; height: 19px; display: block; }
    .menu-btn { display: none; }
    .mobile-nav { display: none; border-top: 1px solid var(--line); background: var(--bg); padding: 10px 0 14px; }
    .mobile-nav.open { display: block; }
    .mobile-nav a { display: block; padding: 12px 20px; font-weight: 700; font-size: 15px; border-bottom: 1px solid var(--line); }
    .mobile-nav a:last-child { border-bottom: 0; }
    .mobile-nav a.active { background: var(--fg); color: var(--bg); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 11px 20px; border-radius: 11px; border: 1.5px solid var(--fg); font-size: 14.5px; font-weight: 700; transition: .15s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-solid { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 22%, transparent); }
    .btn-solid:hover { opacity: .88; }
    .btn-soft { border-color: var(--line); }
    .btn-soft:hover { border-color: var(--fg); }
    .btn-ghost { border: 0; background: none; min-height: auto; padding: 4px 0; color: var(--fg); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
    .btn-sm { min-height: 38px; padding: 7px 14px; font-size: 13px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 22px; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

    .home-hero { padding: 74px 0 56px; border-bottom: 1px solid var(--line); }
    .hero-copy { display: flex; flex-direction: column; align-items: flex-start; }
    .hero-logo { width: 96px; height: 96px; display: grid; place-items: center; border: 2px solid var(--fg); border-radius: 22px; margin-bottom: 26px; overflow: hidden; }
    .hero-logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .home-hero h1 { font-size: clamp(40px, 6.4vw, 72px); letter-spacing: -.05em; }
    .home-hero h1 em { font-style: italic; font-family: var(--serif); font-weight: 600; letter-spacing: -.02em; }
    .hero-sub { max-width: 560px; margin-top: 16px; color: var(--muted); font-size: 16.5px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 26px; color: var(--muted); font-size: 12.5px; font-weight: 650; }
    .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }
    .hero-meta i { font-style: normal; width: 6px; height: 6px; background: var(--fg); border-radius: 1px; }

    .section { padding: 46px 0 30px; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .section-head h2 { margin-top: 9px; font-size: clamp(26px, 3.6vw, 36px); }
    .section-head p { max-width: 420px; color: var(--muted); font-size: 13.5px; }
    .section-head > div:last-child { text-align: right; }

    .class-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .class-card { position: relative; display: flex; flex-direction: column; min-height: 216px; padding: 26px; border: 1.5px solid var(--fg); border-radius: 18px; background: var(--bg); transition: .18s ease; overflow: hidden; }
    .class-card:hover { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: var(--shadow); }
    .class-card::after { content: attr(data-grade); position: absolute; right: 10px; bottom: -30px; font: 800 150px/1 var(--font); letter-spacing: -.12em; color: transparent; -webkit-text-stroke: 1px color-mix(in srgb, var(--fg) 22%, transparent); }
    .class-card:hover::after { -webkit-text-stroke: 1.5px color-mix(in srgb, var(--fg) 30%, transparent); }
    html[data-theme="dark"] .class-card:hover::after { -webkit-text-stroke: 1.5px color-mix(in srgb, var(--bg) 30%, transparent); }
    .class-card .class-kicker { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .class-card:hover .class-kicker { color: inherit; opacity: .65; }
    .class-card h3 { font-size: 30px; margin-top: 14px; position: relative; z-index: 1; }
    .class-card .class-count { margin-top: 6px; font-size: 12.5px; color: var(--muted); font-weight: 650; position: relative; z-index: 1; }
    .class-card:hover .class-count { color: inherit; opacity: .7; }
    .class-card .btn { position: relative; z-index: 1; align-self: flex-start; margin-top: auto; border-color: var(--fg); background: var(--bg); color: var(--fg); }
    .class-card:hover .btn { border-color: rgba(255,255,255,.8); background: rgba(255,255,255,.12); color: #fff; }

    .subjects-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .strip-card { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); transition: .15s ease; }
    .strip-card:hover { border-color: var(--fg); background: var(--bg); }
    .strip-card .strip-icon { font-family: var(--serif); font-size: 21px; font-weight: 700; }
    .strip-card strong { font-size: 14.5px; }
    .strip-card small { color: var(--muted); font-size: 11.5px; font-weight: 600; margin-top: auto; }

    .page-view { padding: 30px 0 72px; }
    .breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .breadcrumbs a:hover { color: var(--fg); text-decoration: underline; }
    .breadcrumbs .current { color: var(--fg); }
    .page-title { font-size: clamp(30px, 4.6vw, 48px); margin-bottom: 10px; }
    .page-intro { max-width: 640px; color: var(--muted); font-size: 14.5px; }

    .class-block { margin-top: 44px; }
    .class-block:first-of-type { margin-top: 8px; }
    .class-block-head { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 2px solid var(--fg); margin-bottom: 18px; }
    .class-block-head h2 { font-size: 26px; }
    .class-block-head .class-badge { font-family: var(--serif); font-size: 15px; padding: 4px 10px; border: 1px solid var(--fg); border-radius: 8px; }
    .class-block-head .btn { margin-left: auto; }
    .subjects-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .subject-card { display: flex; flex-direction: column; gap: 8px; padding: 20px; border: 1px solid var(--line); border-radius: 15px; background: var(--bg); transition: .15s ease; position: relative; }
    .subject-card:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--bg)); transform: translateY(-2px); box-shadow: var(--shadow); }
    .subject-card::after { content: "→"; position: absolute; top: 18px; right: 20px; font-size: 18px; color: var(--muted); transition: .15s ease; }
    .subject-card:hover::after { transform: translateX(3px); color: var(--fg); }
    .subject-card .subj-icon { font-family: var(--serif); font-size: 23px; font-weight: 700; }
    .subject-card h3 { font-size: 18.5px; padding-right: 26px; }
    .subject-card p { color: var(--muted); font-size: 12.5px; }
    .subject-card .subj-meta { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--muted); }
    .subject-card .subj-meta i { font-style: normal; width: 5px; height: 5px; background: var(--line-strong); }

    .subject-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; padding: 28px 30px; border: 1.5px solid var(--fg); border-radius: 18px; }
    .subject-hero h1 { font-size: clamp(30px, 4.6vw, 46px); margin-top: 8px; }
    .subject-hero p { max-width: 620px; margin-top: 8px; color: var(--muted); font-size: 14px; }
    .subject-hero-meta { flex: none; text-align: center; padding: 12px 18px; border: 1px solid var(--line); border-radius: 13px; background: var(--card); }
    .subject-hero-meta strong { display: block; font-size: 26px; }
    .subject-hero-meta span { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .6fr); gap: 18px; align-items: start; margin-top: 22px; }
    .panel { padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
    .panel-title h2 { font-size: 19px; }
    .panel-title span { color: var(--muted); font-size: 11px; font-weight: 700; }
    .chapter-list { display: grid; gap: 8px; }
    .chapter { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
    .chapter.checked { border-color: var(--fg); }
    .chapter-row { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 11px; padding: 11px 12px; border: 0; background: transparent; text-align: left; }
    .chapter-check { width: 21px; height: 21px; display: grid; place-items: center; border: 1.5px solid var(--muted); border-radius: 6px; background: var(--bg); transition: .12s ease; font-size: 12px; font-weight: 900; }
    .chapter.checked .chapter-check { background: var(--fg); border-color: var(--fg); }
    .chapter-num { font-family: var(--serif); font-size: 13px; color: var(--muted); text-align: center; }
    .chapter-title { font-size: 13.5px; font-weight: 700; }
    .chapter-toggle-ic { color: var(--muted); font-size: 15px; transition: transform .15s ease; }
    .chapter.open .chapter-toggle-ic { transform: rotate(45deg); }
    .chapter-body { display: none; padding: 2px 14px 14px 57px; }
    .chapter.open .chapter-body { display: block; }
    .keypoint { padding: 9px 12px; margin-top: 7px; border: 1px dashed var(--line); border-radius: 9px; color: var(--muted); font-size: 12.5px; background: var(--bg); }
    .keypoint b { color: var(--fg); font-family: var(--serif); }
    .progress-wrap { margin-top: 16px; }
    .progress-line { height: 7px; overflow: hidden; border-radius: 99px; background: var(--card-2); border: 1px solid var(--line); }
    .progress-line i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s ease; }
    .progress-meta { display: flex; justify-content: space-between; margin-top: 7px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .side-actions { display: grid; gap: 10px; margin-top: 14px; }
    .side-actions .btn { width: 100%; }
    .checklist-reset { margin-top: 10px; }

    .qr-card { margin-top: 16px; border: 1.5px solid var(--fg); border-radius: 15px; padding: 20px; background: var(--bg); }
    .qr-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .qr-top span { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .qr-count { font-size: 11px; font-weight: 700; color: var(--muted); }
    .qr-chapter { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .qr-text { font-family: var(--serif); font-size: 17.5px; line-height: 1.5; margin: 10px 0 16px; min-height: 74px; }
    .qr-nav { display: flex; gap: 8px; }
    .qr-nav .btn { flex: 1; }

    .steps-rail { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 26px; }
    .step-pill { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px 8px 9px; border: 1.5px solid var(--line); border-radius: 99px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .step-pill i { font-style: normal; width: 23px; height: 23px; display: grid; place-items: center; border: 1.5px solid currentColor; border-radius: 50%; font-size: 11px; }
    .step-pill.current { border-color: var(--fg); color: var(--fg); }
    .step-pill.done { border-color: var(--fg); color: var(--fg); background: var(--fg); color: var(--bg); }
    .rev-grid { display: grid; gap: 16px; }
    .rev-step { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: var(--bg); }
    .rev-step h3 { font-size: 18px; margin-bottom: 4px; }
    .rev-step .step-hint { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
    .choice-grid { display: grid; gap: 10px; }
    .choice-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice-grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .choice { position: relative; display: flex; flex-direction: column; gap: 5px; padding: 15px; border: 1.5px solid var(--line); border-radius: 13px; background: var(--bg); text-align: left; transition: .12s ease; }
    .choice:hover { border-color: var(--fg); }
    .choice.selected { border-color: var(--fg); background: var(--fg); color: var(--bg); }
    .choice .choice-tag { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .choice.selected .choice-tag { color: inherit; opacity: .7; }
    .choice strong { font-size: 14.5px; }
    .choice small { color: var(--muted); font-size: 11.5px; line-height: 1.45; }
    .choice.selected small { color: inherit; opacity: .75; }
    .choice .choice-check { position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; border: 1.5px solid currentColor; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
    .choice.selected .choice-check { background: var(--bg); color: var(--fg); border-color: var(--bg); }
    .chips-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .chip { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--bg); text-align: left; transition: .12s ease; }
    .chip:hover { border-color: var(--fg); }
    .chip.selected { border-color: var(--fg); background: var(--fg); color: var(--bg); }
    .chip .chip-box { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border: 1.5px solid currentColor; border-radius: 5px; font-size: 11px; line-height: 1; }
    .chip.selected .chip-box { background: var(--bg); color: var(--fg); }
    .chip .chip-num { font-family: var(--serif); font-size: 12px; color: var(--muted); flex: none; }
    .chip.selected .chip-num { color: inherit; opacity: .7; }
    .chip .chip-label { font-size: 12.5px; font-weight: 700; line-height: 1.3; }
    .chip-tools { display: flex; gap: 14px; margin-bottom: 13px; }
    .chip-tools button { background: none; border: 0; padding: 0; font-size: 12.5px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); }
    .chip-tools button:hover { color: var(--fg); }
    .summary-box { border: 1.5px solid var(--fg); border-radius: 13px; padding: 18px; background: var(--card); }
    .summary-row { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); }
    .summary-row:last-child { border-bottom: 0; }
    .summary-row span:first-child { color: var(--muted); font-weight: 700; }
    .summary-row span:last-child { font-weight: 800; text-align: right; }
    .rev-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .rev-note { margin-top: 10px; color: var(--muted); font-size: 12px; }

    .paper-wrap { max-width: 860px; margin: 0 auto; }
    .paper-sheet { border: 1.5px solid var(--fg); border-radius: 18px; padding: 34px 38px 40px; background: var(--bg); }
    .paper-head { text-align: center; border-bottom: 2px solid var(--fg); padding-bottom: 20px; margin-bottom: 24px; }
    .paper-head .paper-brand { font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
    .paper-head h1 { font-size: clamp(22px, 3.4vw, 30px); margin: 10px 0 6px; }
    .paper-head .paper-sub { color: var(--muted); font-size: 13.5px; }
    .paper-meta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
    .paper-meta { padding: 6px 13px; border: 1px solid var(--fg); border-radius: 99px; font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .paper-note { margin-top: 14px; color: var(--muted); font-size: 12.5px; }
    .paper-toolbar { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-bottom: 26px; }
    .score-banner { display: none; margin-bottom: 22px; border: 1.5px solid var(--fg); border-radius: 13px; padding: 16px 20px; background: var(--card); }
    .score-banner.show { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .score-banner strong { font-size: 21px; }
    .score-banner .score-detail { color: var(--muted); font-size: 13px; }
    .paper-section { margin-bottom: 26px; }
    .section-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; border-bottom: 1.5px solid var(--fg); padding-bottom: 8px; margin-bottom: 14px; }
    .section-head-row h2 { font-size: 16px; letter-spacing: .02em; }
    .section-head-row .section-marks { font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
    .question { border: 1px solid var(--line); border-radius: 13px; padding: 16px 18px; margin-bottom: 11px; background: var(--bg); transition: border-color .15s ease; }
    .question.correct { border-color: var(--fg); background: var(--card); }
    .question.wrong { border-color: var(--fg); background: var(--card); }
    .q-top { display: flex; align-items: flex-start; gap: 11px; }
    .q-num { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 1.5px solid var(--fg); border-radius: 8px; font-size: 12px; font-weight: 800; }
    .q-text { flex: 1; font-size: 14.5px; line-height: 1.55; }
    .q-marks { flex: none; margin-top: 2px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; font-size: 10.5px; font-weight: 800; color: var(--muted); white-space: nowrap; }
    .q-opts { display: grid; gap: 7px; margin-top: 13px; padding-left: 37px; }
    .q-opt { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: .12s ease; font-size: 13.5px; }
    .q-opt:hover { border-color: var(--fg); }
    .q-opt input { margin: 3px 0 0; accent-color: var(--fg); }
    .q-opt.picked { border-color: var(--fg); background: var(--card); }
    .q-opt.opt-correct { border-color: var(--fg); background: var(--card); }
    .q-opt.opt-wrong { border-color: var(--fg); opacity: .75; }
    .q-opt .opt-letter { font-family: var(--serif); font-weight: 700; flex: none; }
    .q-feedback { display: none; margin-top: 12px; padding: 10px 13px; border-left: 3px solid var(--fg); border-radius: 0 9px 9px 0; background: var(--card); font-size: 13px; }
    .q-feedback.show { display: block; }
    .q-feedback b { display: block; margin-bottom: 3px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .model-answer { margin-top: 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--card); }
    .model-answer summary { padding: 10px 14px; font-size: 12.5px; font-weight: 800; cursor: pointer; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .model-answer[open] summary { color: var(--fg); }
    .model-answer .answer-list { padding: 2px 16px 14px; }
    .answer-list li { font-size: 13.5px; line-height: 1.55; margin-bottom: 6px; }
    .q-chapter-tag { display: inline-block; margin-top: 10px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 10.5px; font-weight: 700; }
    .bm-btn { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; line-height: 1; }
    .bm-btn:hover { border-color: var(--fg); color: var(--fg); }
    .bm-btn.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
    .paper-foot { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 11.5px; }

    .ai-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 8px; }
    .ai-card { display: flex; flex-direction: column; gap: 14px; padding: 28px; border: 1.5px solid var(--fg); border-radius: 18px; background: var(--bg); transition: .18s ease; }
    .ai-card:hover { background: var(--fg); color: var(--bg); }
    .ai-card:hover .ai-desc, .ai-card:hover .ai-for { color: inherit; opacity: .72; }
    .ai-logo { width: 64px; height: 64px; display: grid; place-items: center; border: 1.5px solid currentColor; border-radius: 15px; }
    .ai-logo svg { width: 34px; height: 34px; }
    .ai-card h3 { font-size: 22px; }
    .ai-for { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .ai-desc { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .ai-use { border-top: 1px dashed currentColor; padding-top: 13px; font-size: 12.5px; color: var(--muted); }
    .ai-card .btn { align-self: flex-start; margin-top: auto; }
    .ai-card:hover .btn { border-color: var(--bg); background: var(--bg); color: var(--fg); }
    .ai-tip { margin-top: 20px; padding: 16px 20px; border: 1px dashed var(--line); border-radius: 13px; color: var(--muted); font-size: 13px; }
    .ai-tip b { color: var(--fg); }

    .site-footer { margin-top: auto; padding: 24px 0 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .site-footer-inner { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
    .site-footer b { color: var(--fg); }
    .site-footer a { font-weight: 700; }
    .site-footer a:hover { text-decoration: underline; }

    @media (max-width: 860px) {
      .main-nav { display: none; }
      .menu-btn { display: grid; }
      .subjects-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choice-grid.cols-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chips-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .shell { width: calc(100% - 28px); }
      .brand-text small { display: none; }
      .home-hero { padding: 46px 0 40px; }
      .hero-logo { width: 78px; height: 78px; }
      .hero-logo img { width: 100%; height: 100%; }
      .class-grid, .subjects-grid, .ai-grid, .choice-grid.cols-2 { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .subject-hero { align-items: flex-start; flex-direction: column; padding: 22px 20px; }
      .subject-hero-meta { align-self: flex-start; }
      .paper-sheet { padding: 22px 18px 28px; }
      .q-opts { padding-left: 0; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .section-head > div:last-child { text-align: left; }
    }

    @media print {
      .topbar, .site-footer, .paper-toolbar, .bm-btn, .model-answer summary { display: none !important; }
      .model-answer { border: 1px solid #999; }
      .model-answer .answer-list { display: none; }
      body { background: #fff; color: #000; }
      .paper-sheet { border: 1px solid #000; border-radius: 0; }
      .shell { width: 100%; }
      .question { break-inside: avoid; }
    }
  </style>
</head>
